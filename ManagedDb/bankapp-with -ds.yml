---
# Headless Service for MySQL StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: rds-mysql
  namespace: webapps
spec:
  type: ExternalName
  externalName: rds-mysql.c1qjv0xwz3zv.us-east-1.rds.amazonaws.com
  ports:
    - port: 3306

---
# BankApp Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankapp
  template:
    metadata:
      labels:
        app: bankapp
    spec:
      # Creating a user and initial DB
      initContainers:
        - name: create-db-and-user
          image: mysql:8
          command:
            - sh
            - -c
            - |
              mysql -h rds-mysql -u admin -p"$MYSQL_ROOT_PASSWORD" <<EOF
              CREATE DATABASE IF NOT EXISTS bankappdb;

              CREATE USER IF NOT EXISTS 'bankapp_user'@'%'
              IDENTIFIED BY '${SPRING_DATASOURCE_PASSWORD}';

              GRANT ALL PRIVILEGES ON bankappdb.*
              TO 'bankapp_user'@'%';

              EOF
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankapp-db-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankapp-db-secret
                  key: SPRING_DATASOURCE_PASSWORD

      containers:
        - name: bankapp
          image: surajkhanderao/bankapp:v8
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://rds-mysql:3306/bankappdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bankapp-db-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankapp-db-secret
                  key: SPRING_DATASOURCE_PASSWORD
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
# BankApp Service
apiVersion: v1
kind: Service
metadata:
  name: bankapp-service
  namespace: webapps
spec:
  type: LoadBalancer
  selector:
    app: bankapp
  ports:
    - port: 80
      targetPort: 8080
